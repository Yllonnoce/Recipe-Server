[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recipelib"
version = "0.1.0"
description = "Self-hosted family recipe library: print, paste or drop recipes in; browse, cook, plan and shop from any browser on the LAN."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "platformdirs>=4.2",
    "typer>=0.12",
    "pymupdf>=1.24",
    "playwright>=1.45",
    "recipe-scrapers>=15.0",
    "zeroconf>=0.132",
    "ollama>=0.3",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.0", "onnxruntime>=1.17"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[project.scripts]
recipes = "recipelib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recipelib = ["db/migrations/*.sql", "web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = ["slow: needs OCR/LLM/browser and takes a while"]
