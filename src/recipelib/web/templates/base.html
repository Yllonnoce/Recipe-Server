<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Recipe Library{% endblock %}</title>
<link rel="stylesheet" href="{{ request.url_for('static', path='app.css') }}">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#c8542a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recipes">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
<script src="{{ request.url_for('static', path='vendor/htmx.min.js') }}"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="{{ request.url_for('library') }}">🍲<span class="brand-text"> Recipe Library</span></a>
  <nav>
    <a href="{{ request.url_for('library') }}">Library</a>
    <a href="{{ request.url_for('capture') }}">Add</a>
    <a href="{{ request.url_for('shopping') }}">Shopping</a>
    <a href="{{ request.url_for('plan') }}">Plan</a>
    <a href="{{ request.url_for('settings') }}">Settings{% if update_state.behind %} <span class="upd" title="A newer version is available">update</span>{% endif %}</a>
    <button class="fs" type="button" id="fsBtn" title="Full screen for this page. For full screen that stays on, add the app to your home screen.">&#x26F6;</button>
  </nav>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<script>
(function () {
  const b = document.getElementById('fsBtn');
  if (!b) return;
  const el = document.documentElement;
  const on = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const paint = () => { b.classList.toggle('on', on()); b.title = on() ? 'Exit full screen' : 'Full screen'; };
  b.addEventListener('click', () => {
    if (on()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el).catch(() => {});
  });
  document.addEventListener('fullscreenchange', paint);
  document.addEventListener('webkitfullscreenchange', paint);
  paint();
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
